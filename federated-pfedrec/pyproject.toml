# =====================================================================
# PFedRec: Personalized Federated Recommendation (IJCAI-23)
# Calibration baseline: Client-local score function + global item embeddings
# =====================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "federated-pfedrec"
version = "1.0.0"
description = "PFedRec (IJCAI-23) - Personalized Federated Recommendation via local score function"
license = "Apache-2.0"
dependencies = [
    # Foundation contract (Phase 1) — install ../scripts/foundation/ in editable mode FIRST; see docs/setup.md
    "fedrec-foundation",
    "flwr[simulation]>=1.22.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "wandb>=0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "DangVinh"

[tool.flwr.app.components]
serverapp = "federated_pfedrec.server_app:app"
clientapp = "federated_pfedrec.client_app:app"

[tool.flwr.app.config]
# Federated Learning parameters
num-server-rounds = 100         # Paper default: 100
fraction-train = 1.0
local-epochs = 1                # Paper default: 1

# Strategy
strategy = "fedavg"             # Options: "fedavg" or "fedprox"
proximal-mu = 0.0               # Proximal term for FedProx

# PFedRec Model parameters
latent-dim = 32                 # Paper default: 32
batch-size = 256                # Paper default: 256

# PFedRec Training parameters (dual learning rate)
lr = 0.1                        # Paper default: 0.1 (score function LR)
lr-eta = 80                     # Paper default: 80 (item embedding LR multiplier)
                                # Effective item LR = lr * num_items * lr_eta
num-negatives = 4               # Paper default: 4 (negative samples per positive)
l2-regularization = 0.0         # Paper default: 0.0

# Data partitioning
alpha = 0.5                     # Dirichlet concentration (lower = more non-IID)
partition-mode = "natural"      # "dirichlet" (cross-silo) or "natural" (cross-device, 1 user = 1 client)

# Evaluation (same protocol as other modules)
enable-ranking-eval = true
ranking-k-values = "5,10,20"
eval-split-mode = "leave-one-out"
eval-num-negatives = 99

# Early stopping
early-stopping-enabled = false
early-stopping-patience = 10
early-stopping-metric = "sampled_ndcg@10"
early-stopping-mode = "max"
early-stopping-min-delta = 0.001

# Weights & Biases
wandb-enabled = true
wandb-project = "federated-pfedrec"
wandb-entity = ""
wandb-run-name = ""

# Default federation
[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 5

[tool.flwr.federations.local-sim-gpu]
options.num-supernodes = 5
options.backend.client-resources.num-cpus = 12
options.backend.client-resources.num-gpus = 0.2
