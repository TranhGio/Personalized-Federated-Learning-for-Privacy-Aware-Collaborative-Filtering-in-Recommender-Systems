# =====================================================================
# For a full TOML configuration guide, check the Flower docs:
# https://flower.ai/docs/framework/how-to-configure-pyproject-toml.html
# =====================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "federated-baseline-cf"
version = "1.0.0"
description = ""
license = "Apache-2.0"
# Dependencies for your Flower App
dependencies = [
    # Foundation contract (Phase 1) — install ../scripts/foundation/ in editable mode FIRST; see docs/setup.md
    "fedrec-foundation",
    "flwr[simulation]>=1.22.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "wandb>=0.16.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "DangVinh"

# Point to your ServerApp and ClientApp objects
[tool.flwr.app.components]
serverapp = "federated_baseline_cf.server_app:app"
clientapp = "federated_baseline_cf.client_app:app"

# Custom config values accessible via `context.run_config`
[tool.flwr.app.config]
# Phase 2 (BSL-01..08): cross-device defaults. fedrec_foundation.mode.resolve_mode_defaults(mode) (Phase 1 Plan 05) is the canonical source for hyperparameters at runtime; these pyproject values are only consulted when mode is unset. Overrides are visible per D-19.
# Federated Learning parameters
num-server-rounds = 10
fraction-train = 1.0
local-epochs = 5

# Federated Learning Strategy
strategy = "fedavg"         # Options: "fedavg" (default) or "fedprox"
proximal-mu = 0.01           # Proximal term strength for FedProx (μ in paper)
                            # When 0.0, FedProx behaves identically to FedAvg
                            # Recommended values: 0.001, 0.01, 0.1, 1.0

# Model parameters
model-type = "basic"  # Options: "basic" (MSE) or "bpr" (Bayesian Personalized Ranking)
embedding-dim = 128  # Latent factor dimensionality (32, 64, 128, 256)
dropout = 0.1       # Dropout rate for regularization

# Training parameters
lr = 0.005          # Learning rate (Adam optimizer)
weight-decay = 1e-5 # L2 regularization strength
num-negatives = 1   # Number of negative samples per positive (for BPR only)

# Data partitioning
partition-mode = "natural"  # "dirichlet" (cross-silo) or "natural" (cross-device, 1 user = 1 client)
alpha = 0.5         # Dirichlet concentration parameter (lower = more non-IID, only for dirichlet mode)

# Ranking evaluation
enable-ranking-eval = true        # Enable comprehensive ranking metrics evaluation
ranking-k-values = "5,10,20"      # K values for Hit Rate, Precision, Recall, NDCG metrics (comma-separated)

# Evaluation protocol
eval-split-mode = "leave-one-out"  # "leave-one-out" (NCF protocol) or "random"
# (eval-num-negatives is declared below in the "Phase 2 cross-device / foundation-contract keys" block)

# Early stopping
early-stopping-enabled = false
early-stopping-patience = 10
early-stopping-metric = "sampled_ndcg@10"
early-stopping-mode = "max"
early-stopping-min-delta = 0.001

# Weights & Biases (wandb) configuration
wandb-enabled = true              # Enable/disable wandb logging
wandb-project = ""                # empty = route by mode in server_app (cross-device -> federated-cf-cross-device; cross-silo-legacy -> federated-cf). Set a non-empty string here or via --run-config to pin.
wandb-entity = ""                 # wandb team/entity (optional, uses default if empty)
wandb-run-name = ""               # Custom run name (optional, auto-generated if empty)

# Phase 2 cross-device / foundation-contract keys (BSL-01..08)
mode = "benchmark_cross_device"  # Default matches the locked federation `num-supernodes=6040`. Opt into cross-silo via: --run-config "num-supernodes=5 partition-mode=dirichlet mode=cross_silo_legacy". Values: benchmark_cross_device | thesis_crossdevice_main | paper_compat_pfedrec | cross_silo_legacy.
run-seed = 42  # FND-06: single root seed for py_rng/np_rng/torch_gen/server_rng.
weight-policy = "num_positives"  # FND-05: aggregation weight policy. Values: uniform | num_positives | num_training_examples.
eval-num-negatives = 99  # NCF protocol: 99 sampled negatives + 1 held-out positive (sampled_loo_99).
checkpoint-rule = "best_round_restore"  # D-27: track best sampled_ndcg@10; restore at final evaluation.

# Phase 7 D-22 thesis-tagging keys. Default sentinels = non-thesis run.
# Orchestrator scripts/thesis/run_thesis_sweep.py overrides these via --run-config.
# fuse_dicts requires the keys to exist with default values — declaring here is the contract.
thesis-run-label = ""        # "" = non-thesis | "main" | "ablation_<knob>=<value>"
ablation-dimension = "none"  # "none" | "alpha_method" | "per_user_alpha" | "item_perturbation" | "contrastive_lambda" | "fusion_type"
ablation-value = ""           # specific value of the ablated knob; empty for main/non-thesis

# Default federation to use when running the app
[tool.flwr.federations]
default = "local-sim-gpu"
# Baseline defaults to GPU execution. CPU federation (local-simulation) remains available
# as an opt-in via: flwr run . local-simulation, or via: python scripts/run.py ... --federation local-simulation.
# Kept because tensors serialize/deserialize via CPU (state_dict caches, wandb logging, hash
# computation) and the cross-silo-legacy appendix path works fine on CPU.

# Local simulation federation (CPU-only)
[tool.flwr.federations.local-simulation]
options.num-supernodes = 6040
# Cross-device default (BSL-01). Opt into cross-silo via: flwr run . --run-config "num-supernodes=5 partition-mode=dirichlet mode=cross_silo_legacy"

# GPU-enabled simulation federation (requires PyTorch with CUDA support)
# Run with: flwr run . local-sim-gpu
#
# Per-client resource allocation is tuned for cross-device simulation (N=6040, BPR-MF).
# BPR-MF per-client footprint: ~15-50 MB VRAM (user_emb 3MB + item_emb 2MB + Adam state + batch activations).
# With num-gpus=0.05, ~20 concurrent clients fit on a single consumer GPU with 8+ GB VRAM.
# num-cpus=1 keeps the CPU scheduler from bottlenecking (one thread per client for dataloader/negsampling).
# For larger models (e.g. deep NCF, embedding-dim=256), raise num-gpus to 0.1-0.2.
# For a lighter-weight smoke test on a low-end GPU, pass `fraction-train=0.01` via --run-config.
[tool.flwr.federations.local-sim-gpu]
options.num-supernodes = 6040
# Cross-device default (BSL-01). Opt into cross-silo via: flwr run . --run-config "num-supernodes=5 partition-mode=dirichlet mode=cross_silo_legacy"
# Resource budget aligned with adaptive (5 concurrent workers). The previous
# (num-cpus=1, num-gpus=0.05) values let Ray spawn 20 concurrent workers,
# producing a ~61 GB peak that OOM'd on a 62 GB machine when other GPU jobs
# (e.g. shared inference services) are also resident. Slower per-round but
# fits the shared-machine budget.
options.backend.client-resources.num-cpus = 6
options.backend.client-resources.num-gpus = 0.2

# Remote federation example for use with SuperLink
[tool.flwr.federations.remote-federation]
address = "<SUPERLINK-ADDRESS>:<PORT>"
insecure = true  # Remove this line to enable TLS
# root-certificates = "<PATH/TO/ca.crt>"  # For TLS setup
